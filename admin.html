<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GIMISCO | Private Admin</title>

  <meta name="robots" content="noindex,nofollow">

  <link rel="stylesheet" href="css/admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginScreen" class="admin-login">

    <div class="login-box">

      <div class="login-logo">
        GIMISCO
      </div>

      <div class="gold-line"></div>

      <span class="admin-label">
        PRIVATE ADMINISTRATION
      </span>

      <h1>Admin Login</h1>

      <p>
        Sign in to manage GIMISCO website media.
      </p>

      <form id="loginForm">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="Admin email"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Password"
          required
        >

        <button
          type="submit"
          id="loginButton"
        >
          SIGN IN
        </button>

        <div id="loginMessage"></div>

      </form>

      <a href="index.html">
        ← Return to website
      </a>

    </div>

  </section>


  <!-- =========================
       DASHBOARD
  ========================== -->

  <section
    id="dashboardScreen"
    class="dashboard"
    hidden
  >

    <header class="dashboard-header">

      <div>
        <span class="admin-label">
          GIMISCO GLOBAL INVESTMENT LIMITED
        </span>

        <h1>Media Dashboard</h1>
      </div>

      <div class="dashboard-actions">

        <a
          href="index.html"
          class="secondary-button"
        >
          VIEW WEBSITE
        </a>

        <button
          id="logoutButton"
          class="logout-button"
        >
          LOGOUT
        </button>

      </div>

    </header>


    <main class="dashboard-main">

      <!-- STATISTICS -->

      <section class="statistics">

        <div class="stat">
          <span>Total Media</span>
          <strong id="totalMedia">0</strong>
        </div>

        <div class="stat">
          <span>Images</span>
          <strong id="totalImages">0</strong>
        </div>

        <div class="stat">
          <span>Videos</span>
          <strong id="totalVideos">0</strong>
        </div>

      </section>


      <!-- UPLOAD -->

      <section class="admin-panel">

        <div class="panel-heading">

          <div>
            <span class="admin-label">
              CONTENT MANAGEMENT
            </span>

            <h2>Upload Media</h2>
          </div>

        </div>


        <form id="uploadForm">

          <div class="form-row">

            <div class="form-group">

              <label for="mediaTitle">
                Title
              </label>

              <input
                id="mediaTitle"
                type="text"
                placeholder="Enter media title"
                required
              >

            </div>


            <div class="form-group">

              <label for="mediaType">
                Type
              </label>

              <select id="mediaType">

                <option value="image">
                  Image
                </option>

                <option value="video">
                  Video
                </option>

              </select>

            </div>

          </div>


          <div class="form-group">

            <label for="mediaDescription">
              Description
            </label>

            <textarea
              id="mediaDescription"
              placeholder="Enter a description"
            ></textarea>

          </div>


          <div class="form-group">

            <label for="mediaFile">
              Select Image / Video
            </label>

            <input
              id="mediaFile"
              type="file"
              accept="image/*,video/*"
              required
            >

          </div>


          <button
            type="submit"
            id="uploadButton"
            class="primary-button"
          >
            UPLOAD & PUBLISH
          </button>

          <div
            id="uploadMessage"
            class="message"
          ></div>

        </form>

      </section>


      <!-- MEDIA LIBRARY -->

      <section class="admin-panel">

        <div class="panel-heading">

          <div>
            <span class="admin-label">
              PUBLISHED CONTENT
            </span>

            <h2>Media Library</h2>
          </div>

          <button
            id="refreshButton"
            class="secondary-button"
          >
            REFRESH
          </button>

        </div>


        <div
          id="adminMediaGrid"
          class="admin-media-grid"
        >

          <div class="empty-state">
            Loading media...
          </div>

        </div>

      </section>

    </main>

  </section>


  <script src="js/admin.js"></script>

</body>
</html>
